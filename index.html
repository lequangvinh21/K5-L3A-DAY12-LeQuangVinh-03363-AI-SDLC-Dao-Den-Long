<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đảo Đèn Lồng · Ba hòn đảo</title><link rel="stylesheet" href="/src/game.css"></head><body>
<main id="world" aria-label="Quần đảo 3D"></main>
<header><small id="night"></small><div id="life"></div></header><span id="clock"></span>
<aside><span id="lights"></span><span id="points"></span></aside>
<section class="pack"><small>ĐOM ĐÓM</small><strong id="bag"></strong></section>
<section class="progress"><div id="cool"></div></section>
<div id="captions" role="status"></div><div id="spawn-arrow" hidden aria-hidden="true">➤</div><div id="arrow"></div><div id="hint" role="status"></div>
<footer><b>WASD</b> Di chuyển <b>Space</b> Nhảy <b>Shift</b> Lướt <b>E</b> Nạp <b>F</b> Tỏa sáng <b>P</b> Tạm dừng</footer>
<dialog><small id="eyebrow"></small><h1></h1><p></p><div id="controls"></div><div id="buttons"></div></dialog>
<script type="module" src="/src/game.js"></script></body></html>
